<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>レオパ管理 / 設定</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>
  <header class="appbar">
    <h1>🦎 ひとつなぎ動物管理</h1>
    <nav>
      <a href="/">入力</a>
      <a href="/history.html">履歴</a>
      <a href="/individual.html">個体別</a>
      <a href="/settings.html" class="active">設定</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h3>個体マスタ
        <span style="font-size:11px;color:var(--muted);font-weight:normal;margin-left:8px">⋮⋮ をドラッグして並び替え可能</span>
      </h3>
      <div id="animalsList"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <input type="text" id="newAnimalName" placeholder="新規個体名（例: ⑪、ガブリエル）" style="max-width:280px">
        <button class="btn btn-primary" id="addAnimal">追加</button>
      </div>
    </div>

    <div class="card">
      <h3>餌マスタ</h3>
      <div id="foodsList"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <input type="text" id="newFoodName" placeholder="新規餌（例: ハニーワーム）" style="max-width:280px">
        <button class="btn btn-primary" id="addFood">追加</button>
      </div>
    </div>

    <div class="card">
      <h3>担当者マスタ</h3>
      <div id="staffList"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <input type="text" id="newStaffName" placeholder="新規担当者名" style="max-width:280px">
        <button class="btn btn-primary" id="addStaff">追加</button>
      </div>
    </div>

    <div class="card">
      <h3>Chatwork通知テスト</h3>
      <p style="color:var(--muted);font-size:13px">
        サーバー側 <code>.env</code> に <code>CHATWORK_API_TOKEN</code> と <code>CHATWORK_ROOM_ID</code> を設定してから押してください。
      </p>
      <button class="btn btn-primary" id="testNotify">通知を送信</button>
      <button class="btn" id="dryRun">送信せずログ確認</button>
      <div id="notifyResult" style="margin-top:12px;font-family:monospace;font-size:12px"></div>
    </div>

    <div class="card">
      <h3>アラート手動実行</h3>
      <p style="color:var(--muted);font-size:13px">
        通常は朝9時／夜20時に自動実行されますが、手動で確認することもできます。
      </p>
      <button class="btn" id="runAlerts">アラートチェック実行（送信あり）</button>
      <button class="btn" id="runAlertsDry">アラートチェック（送信なし）</button>
      <pre id="alertResult" style="margin-top:12px;background:#f8f6f0;padding:8px;border-radius:6px;font-size:12px"></pre>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (s) => document.querySelector(s);
    function toast(t) {
      const el = $('#toast'); el.textContent = t; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1500);
    }
    async function api(method, url, body) {
      const r = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      return r.json();
    }
    function simpleRow(items, kind) {
      return items.map(it => `
        <div class="list-row">
          <span class="name">${it.name} ${it.active ? '' : '<span class="badge">無効</span>'}</span>
        </div>
      `).join('');
    }
    function animalRow(a, index) {
      const sexClass = a.category === 'sale' ? 'cat-sale' : (a.sex === 'M' ? 'sex-M' : a.sex === 'F' ? 'sex-F' : '');
      const sexBadge = a.sex === 'M' ? '♂' : a.sex === 'F' ? '♀' : '?';
      return `
        <div class="list-row" data-id="${a.id}" style="align-items:center;padding:8px 0">
          <span class="drag-handle" style="cursor:grab;color:var(--muted);user-select:none;padding:0 6px" title="ドラッグして並び替え">⋮⋮</span>
          <span class="row-num" style="min-width:32px;color:var(--muted);font-size:12px;text-align:right">#${index + 1}</span>
          ${a.photo_url ? `<img src="${a.photo_url}" style="width:40px;height:40px;border-radius:6px;object-fit:cover" onerror="this.style.display='none'">` : '<div style="width:40px;height:40px;background:var(--bg);border-radius:6px"></div>'}
          <span class="name" style="display:flex;flex-direction:column">
            <strong>${a.name} <span style="font-size:11px;color:var(--muted)">${sexBadge} / ${a.category === 'sale' ? '販売個体' : '名前付き'}</span></strong>
            <span style="font-size:11px;color:var(--muted)">${a.morph || 'モルフ未設定'}</span>
          </span>
          <button class="btn btn-soft" data-edit="${a.id}">編集</button>
          <button class="btn btn-ghost" data-deact="${a.id}">${a.active ? '無効化' : '有効化'}</button>
        </div>
      `;
    }

    function renumberRows() {
      $('#animalsList').querySelectorAll('.list-row').forEach((row, i) => {
        const numEl = row.querySelector('.row-num');
        if (numEl) numEl.textContent = '#' + (i + 1);
      });
    }

    async function loadAll() {
      const animals = await api('GET', '/api/animals?all=1');
      $('#animalsList').innerHTML = animals.map((a, i) => animalRow(a, i)).join('');

      // ドラッグ&ドロップ並び替え
      if (window.Sortable && !$('#animalsList')._sortable) {
        $('#animalsList')._sortable = new Sortable($('#animalsList'), {
          handle: '.drag-handle',
          animation: 150,
          onEnd: async () => {
            renumberRows();
            const items = Array.from($('#animalsList').querySelectorAll('.list-row')).map((row, i) => ({
              id: Number(row.dataset.id),
              display_order: i + 1,
            }));
            try {
              await api('POST', '/api/animals/reorder', { items });
              toast('並び順を保存しました');
            } catch (e) {
              alert('並び順の保存に失敗しました');
            }
          },
        });
      }
      $('#animalsList').querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(animals.find(a => a.id == btn.dataset.edit)));
      });
      $('#animalsList').querySelectorAll('[data-deact]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const animal = animals.find(a => a.id == btn.dataset.deact);
          const isActive = animal && animal.active;
          const name = animal ? animal.name : 'この個体';
          if (isActive) {
            if (!confirm(`${name} を無効化しますか？（過去データは残ります）`)) return;
            await fetch(`/api/animals/${btn.dataset.deact}`, { method: 'DELETE' });
          } else {
            if (!confirm(`${name} を有効化しますか？`)) return;
            await fetch(`/api/animals/${btn.dataset.deact}/activate`, { method: 'POST' });
          }
          toast('変更しました'); loadAll();
        });
      });
      const foods = await api('GET', '/api/foods?all=1');
      $('#foodsList').innerHTML = simpleRow(foods);
      const staff = await api('GET', '/api/staff?all=1');
      $('#staffList').innerHTML = simpleRow(staff);
    }

    function openEditModal(a) {
      const html = `
        <div class="modal-bg" id="modalBg" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200">
          <div style="background:#fff;padding:24px;border-radius:12px;max-width:500px;width:90%;max-height:90vh;overflow:auto">
            <h3 style="margin-top:0">${a.name} を編集</h3>
            <div class="field-row">
              <div><label>名前</label><input type="text" id="m-name" value="${a.name || ''}"></div>
              <div><label>カテゴリ</label>
                <select id="m-category">
                  <option value="named" ${a.category === 'named' ? 'selected' : ''}>名前付き</option>
                  <option value="sale" ${a.category === 'sale' ? 'selected' : ''}>販売個体（番号）</option>
                </select>
              </div>
              <div><label>性別</label>
                <select id="m-sex">
                  <option value="M" ${a.sex === 'M' ? 'selected' : ''}>♂ オス</option>
                  <option value="F" ${a.sex === 'F' ? 'selected' : ''}>♀ メス</option>
                  <option value="U" ${a.sex === 'U' ? 'selected' : ''}>不明</option>
                </select>
              </div>
              <div><label>生年月日</label><input type="date" id="m-birth" value="${a.birth_date || ''}"></div>
            </div>
            <div style="margin-top:8px"><label>モルフ</label>
              <input type="text" id="m-morph" value="${a.morph || ''}" placeholder="例: タンジェリン × ブラッド">
            </div>
            <div style="margin-top:8px"><label>系統</label>
              <input type="text" id="m-lineage" value="${a.lineage || ''}" placeholder="例: Tangerine_BloodxMandarin">
            </div>
            <div style="margin-top:8px"><label>写真</label>
              ${a.photo_url ? `<div style="margin-bottom:8px"><img src="${a.photo_url}" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--border)"></div>` : ''}
              <div id="m-drop" style="border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:#fafafa">
                📁 ここに画像をドロップ、またはクリックして選択<br>
                <span style="font-size:11px">（jpg/png/webp/heic、最大25MB／自動で圧縮されます）</span>
              </div>
              <input type="file" id="m-file" accept="image/*,.heic,.heif" style="display:none">
              <input type="text" id="m-photo" value="${a.photo_url || ''}" placeholder="https://... （直接URL入力もOK）" style="margin-top:8px">
            </div>
            <div style="margin-top:8px"><label>参照元URL</label>
              <input type="text" id="m-source" value="${a.source_url || ''}">
            </div>
            <div style="margin-top:8px"><label>メモ</label>
              <textarea id="m-notes">${a.notes || ''}</textarea>
            </div>
            <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
              <button class="btn" id="m-cancel">キャンセル</button>
              <button class="btn btn-primary" id="m-save">保存</button>
            </div>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      $('#m-cancel').onclick = () => $('#modalBg').remove();

      // === 写真アップロード（ドロップ＆ファイル選択） ===
      const drop = $('#m-drop');
      const fileInput = $('#m-file');
      const photoInput = $('#m-photo');

      function isHeic(file) {
        const name = (file.name || '').toLowerCase();
        return name.endsWith('.heic') || name.endsWith('.heif') ||
               file.type === 'image/heic' || file.type === 'image/heif';
      }

      async function uploadPhoto(file) {
        if (!file) return;
        if (file.size > 25 * 1024 * 1024) { alert('25MB以下にしてください'); return; }

        // HEIC は事前にJPEGに変換
        if (isHeic(file)) {
          drop.innerHTML = '⏳ HEIC を JPEG に変換中...（10〜30秒）';
          try {
            const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
            file = new File([blob], (file.name || 'photo').replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
          } catch (e) {
            console.error('HEIC変換失敗:', e);
            drop.innerHTML = '❌ HEIC の変換に失敗しました。iPhone のカメラ設定を「互換性優先」にするか、JPEGで保存し直してください。';
            return;
          }
        } else if (!file.type.startsWith('image/')) {
          alert('画像ファイルのみアップロードできます'); return;
        }

        drop.innerHTML = '⏳ 圧縮&アップロード中...';
        try {
          const form = new FormData();
          form.append('file', file);
          const r = await fetch('/api/upload-photo', { method: 'POST', body: form });
          if (!r.ok) throw new Error('upload failed');
          const data = await r.json();
          photoInput.value = data.url;
          drop.innerHTML = '✅ アップロード完了: <br><img src="' + data.url + '" style="max-width:120px;max-height:120px;border-radius:8px;margin-top:8px">';
        } catch (e) {
          drop.innerHTML = '❌ アップロード失敗（もう一度試してください）';
          console.error(e);
        }
      }

      drop.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => uploadPhoto(e.target.files[0]));
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background = '#e7f3ff'; });
      drop.addEventListener('dragleave', () => { drop.style.background = '#fafafa'; });
      drop.addEventListener('drop', e => {
        e.preventDefault();
        drop.style.background = '#fafafa';
        uploadPhoto(e.dataTransfer.files[0]);
      });

      $('#m-save').onclick = async () => {
        const payload = {
          id: a.id,
          name: $('#m-name').value.trim(),
          display_order: a.display_order,
          active: a.active,
          notes: $('#m-notes').value || null,
          category: $('#m-category').value,
          sex: $('#m-sex').value,
          morph: $('#m-morph').value || null,
          lineage: $('#m-lineage').value || null,
          birth_date: $('#m-birth').value || null,
          photo_url: $('#m-photo').value || null,
          source_url: $('#m-source').value || null
        };
        const r = await fetch('/api/animals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (r.ok) {
          $('#modalBg').remove();
          toast('保存しました'); loadAll();
        } else {
          alert('保存失敗');
        }
      };
    }
    $('#addAnimal').addEventListener('click', async () => {
      const name = $('#newAnimalName').value.trim();
      if (!name) return;
      await api('POST', '/api/animals', { name, display_order: 99 });
      $('#newAnimalName').value = '';
      toast('追加しました'); loadAll();
    });
    $('#addFood').addEventListener('click', async () => {
      const name = $('#newFoodName').value.trim();
      if (!name) return;
      await api('POST', '/api/foods', { name, display_order: 99 });
      $('#newFoodName').value = '';
      toast('追加しました'); loadAll();
    });
    $('#addStaff').addEventListener('click', async () => {
      const name = $('#newStaffName').value.trim();
      if (!name) return;
      await api('POST', '/api/staff', { name });
      $('#newStaffName').value = '';
      toast('追加しました'); loadAll();
    });

    $('#testNotify').addEventListener('click', async () => {
      const r = await fetch('/api/notify/test', { method: 'POST' }).then(r => r.json());
      $('#notifyResult').textContent = JSON.stringify(r, null, 2);
    });
    $('#dryRun').addEventListener('click', async () => {
      const r = await fetch('/api/notify/test?dry=1', { method: 'POST' }).then(r => r.json());
      $('#notifyResult').textContent = JSON.stringify(r, null, 2) + '\n（dryRun: 実送信していません）';
    });
    $('#runAlerts').addEventListener('click', async () => {
      const r = await fetch('/api/notify/run', { method: 'POST' }).then(r => r.json());
      $('#alertResult').textContent = JSON.stringify(r, null, 2);
    });
    $('#runAlertsDry').addEventListener('click', async () => {
      const r = await fetch('/api/notify/run?dry=1', { method: 'POST' }).then(r => r.json());
      $('#alertResult').textContent = JSON.stringify(r, null, 2);
    });

    loadAll();
  </script>
</body>
</html>
