<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>レオパ管理 / 配置図</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .map-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .map-note { color:var(--muted); font-size:12px; }

    /* ==== 全体図（部屋を正面から見た配置） ==== */
    .room {
      display:grid; grid-template-columns: 2fr 3fr; gap:18px;
      max-width:1100px; margin:0 auto 28px;
    }
    @media (max-width: 800px) { .room { grid-template-columns: 1fr; } }
    .zone {
      border:2px solid var(--border); border-radius:14px;
      padding:14px; background:var(--card);
    }
    .zone-title {
      font-size:13px; font-weight:700; margin-bottom:10px;
      display:flex; align-items:center; gap:6px; color:var(--muted);
    }
    .zone-grid { display:grid; gap:8px; }
    .zone-grid.cols2 { grid-template-columns:1fr 1fr; }
    .zone-grid.cols3 { grid-template-columns:1fr 1fr 1fr; }
    .zone-row-label { font-size:11px; color:var(--muted); margin:8px 2px 4px; }

    .cell {
      border:1px solid var(--border); border-radius:10px;
      padding:6px; text-align:center; background:#fff;
      display:flex; flex-direction:column; gap:4px; align-items:center;
    }
    .cell.empty { border-style:dashed; background:transparent; }
    .cell.black-case { border-width:2px; border-color:#333; }
    .cell .ph {
      width:100%; aspect-ratio: 4/3; border-radius:6px; overflow:hidden;
      background:var(--bg); display:flex; align-items:center; justify-content:center;
      font-size:22px; color:var(--muted);
    }
    .cell .ph img { width:100%; height:100%; object-fit:cover; display:block; }
    .cell .cn { font-size:13px; font-weight:700; line-height:1.2; }
    .cell .cp { font-size:10px; color:var(--muted); }
    .cell.sm .ph { aspect-ratio: 16/9; }
    .cell.sm .cn { font-size:12px; }

    /* ==== 詳細カード ==== */
    .rack { max-width: 1100px; margin: 0 auto; }
    .rack-row-label { font-size:13px; font-weight:600; color:var(--muted); margin: 16px 4px 8px; }
    .rack-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
    @media (max-width: 700px) { .rack-row { grid-template-columns: 1fr; } }

    .slot {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .slot.empty { border-style: dashed; background: transparent; }
    .slot-pos { font-size: 12px; color: var(--muted); font-weight: 600; display:flex; align-items:center; gap:6px; }
    .slot-photo {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: var(--bg);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; font-size: 40px; color: var(--muted);
    }
    .slot-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .slot-name { font-size: 20px; font-weight: 700; line-height:1.3; }
    .slot-name .sex { font-size:14px; font-weight:400; margin-left:6px; }
    .slot-meta { font-size: 12px; color: var(--muted); min-height: 1.2em; }

    /* 販売個体テーブル（コンパクト表示） */
    .table-cols { display:grid; grid-template-columns: 1fr 1fr; gap:14px; max-width:760px; }
    @media (max-width: 700px) { .table-cols { grid-template-columns: 1fr; } }
    .col-label { font-size:12px; color:var(--muted); margin: 0 4px 6px; }
    .slot-sm {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; margin-bottom: 8px; display:flex; align-items:center; gap:10px;
    }
    .slot-sm.black-case { border-width:2px; border-color:#333; }
    .slot-sm .thumb {
      width: 48px; height: 48px; border-radius: 8px; flex:none; background: var(--bg);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; font-size:22px; color:var(--muted);
    }
    .slot-sm .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .slot-sm .nm { font-size:16px; font-weight:700; }
    .slot-sm .mt { font-size:11px; color:var(--muted); }

    @media print {
      header.appbar, .map-toolbar { display:none !important; }
      body { background:#fff; }
      .slot, .zone, .cell { break-inside: avoid; }
      main { padding: 0; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <h1>🦎 ひとつなぎ動物管理</h1>
    <nav>
      <a href="/">入力</a>
      <a href="/history.html">履歴</a>
      <a href="/individual.html">個体別</a>
      <a href="/map.html" class="active">配置図</a>
      <a href="/settings.html">設定</a>
    </nav>
  </header>

  <main>
    <h2>🗺 飼育場所マップ</h2>

    <div class="map-toolbar">
      <button class="btn btn-primary" id="printBtn">🖨 印刷する</button>
      <span class="map-note">部屋を正面から見た配置です（2026年6月時点）。写真・モルフは個体マスタから自動表示されます。</span>
    </div>

    <!-- ==== 全体図 ==== -->
    <h3 style="max-width:1100px;margin:0 auto 10px;">全体図</h3>
    <div class="room">
      <div class="zone">
        <div class="zone-title">⬜ 白いテーブル（販売個体・左側）</div>
        <div class="zone-grid cols2" id="zoneTable"></div>
      </div>
      <div class="zone">
        <div class="zone-title">🪵 木の棚（名前付き個体・右側）</div>
        <div class="zone-row-label">上段（棚の上）</div>
        <div class="zone-grid cols3" id="zoneBack"></div>
        <div class="zone-row-label">前列（手前）</div>
        <div class="zone-grid cols3" id="zoneFront"></div>
      </div>
    </div>

    <!-- ==== 詳細 ==== -->
    <h3 style="max-width:1100px;margin:0 auto;">詳細</h3>
    <div class="rack">
      <div class="rack-row-label">上段（棚の上）</div>
      <div class="rack-row" id="rowBack"></div>
      <div class="rack-row-label">前列（手前・テーブル上）</div>
      <div class="rack-row" id="rowFront"></div>

      <div class="rack-row-label">左の白いテーブル（販売個体ケース）</div>
      <div class="table-cols">
        <div>
          <div class="col-label">左列（奥 → 手前）</div>
          <div id="colLeft"></div>
        </div>
        <div>
          <div class="col-label">右列（奥 → 手前）</div>
          <div id="colRight"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    'use strict';

    // ==== 配置定義（変更時はここを書き換える） ====
    // name: 個体マスタの名前と一致させると写真・モルフが自動表示される。空きは null
    const SLOTS = [
      { row: 'rowBack',  zone: 'zoneBack',  label: '左奥（黒い背高ケージ）', name: null },
      { row: 'rowBack',  zone: 'zoneBack',  label: '上段中央（植物ケージ）', name: 'アリストテレス' },
      { row: 'rowBack',  zone: 'zoneBack',  label: '右奥（温湿度計付き）',   name: null },
      { row: 'rowFront', zone: 'zoneFront', label: '前列・左',               name: 'ノブナガ' },
      { row: 'rowFront', zone: 'zoneFront', label: '前列・中央',             name: 'アレク' },
      { row: 'rowFront', zone: 'zoneFront', label: '前列・右',               name: 'もみじ' },
    ];

    // 左の白いテーブル：販売個体ケースの並び（奥 → 手前）
    const TABLE_COLS = {
      colLeft:  [
        { name: '①' }, { name: '②' }, { name: '③' }, { name: '④' },
        { name: '11', note: '黒ケース（最前列）', black: true },
      ],
      colRight: [
        { name: '⑩' }, { name: '⑨' }, { name: '⑧' }, { name: '⑦' }, { name: '⑥' },
      ],
    };

    // カタカナ→ひらがな + 空白除去（名前のゆらぎ吸収）
    function norm(s) {
      return (s || '')
        .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
        .replace(/\s+/g, '');
    }

    function sexMark(sex) {
      if (sex === 'M') return '<span class="sex">♂</span>';
      if (sex === 'F') return '<span class="sex">♀</span>';
      return '';
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function findAnimal(animals, name) {
      return animals.find(x => norm(x.name) === norm(name)) || null;
    }

    function photoHtml(a) {
      return a && a.photo_url ? `<img src="${esc(a.photo_url)}" alt="${esc(a.name)}" loading="lazy">` : '🦎';
    }

    function render(animals) {
      // ---- 全体図 ----
      // 木の棚（上段・前列）
      document.getElementById('zoneBack').innerHTML = '';
      document.getElementById('zoneFront').innerHTML = '';
      for (const slot of SLOTS) {
        const a = slot.name ? (findAnimal(animals, slot.name) || { name: slot.name }) : null;
        const div = document.createElement('div');
        div.className = 'cell' + (a ? '' : ' empty');
        div.innerHTML = a
          ? `<div class="ph">${photoHtml(a)}</div><div class="cn">${esc(a.name)}${sexMark(a.sex)}</div>`
          : `<div class="ph">―</div><div class="cn" style="color:var(--muted);font-weight:400">空き</div>`;
        document.getElementById(slot.zone).appendChild(div);
      }
      // 白いテーブル（2列：左列・右列を横並びで、奥→手前の順に下へ）
      const zt = document.getElementById('zoneTable');
      zt.innerHTML = '';
      const maxLen = Math.max(TABLE_COLS.colLeft.length, TABLE_COLS.colRight.length);
      for (let i = 0; i < maxLen; i++) {
        for (const colName of ['colLeft', 'colRight']) {
          const c = TABLE_COLS[colName][i];
          const div = document.createElement('div');
          if (!c) { div.className = 'cell sm empty'; div.innerHTML = ''; zt.appendChild(div); continue; }
          const a = findAnimal(animals, c.name) || { name: c.name };
          div.className = 'cell sm' + (c.black ? ' black-case' : '');
          div.innerHTML = `<div class="ph">${photoHtml(a)}</div><div class="cn">${esc(a.name)}</div><div class="cp">${i === 0 ? '奥' : (c.note ? '手前・黒' : '')}</div>`;
          zt.appendChild(div);
        }
      }

      // ---- 詳細カード ----
      document.getElementById('rowBack').innerHTML = '';
      document.getElementById('rowFront').innerHTML = '';
      for (const slot of SLOTS) {
        const a = slot.name ? (findAnimal(animals, slot.name) || { name: slot.name }) : null;
        const div = document.createElement('div');
        div.className = 'slot' + (a ? '' : ' empty');
        div.innerHTML = `
          <div class="slot-pos">📍 ${esc(slot.label)}</div>
          <div class="slot-photo">${photoHtml(a)}</div>
          <div class="slot-name">${a ? esc(a.name) + sexMark(a.sex) : '<span style="color:var(--muted);font-size:14px;font-weight:400">空き</span>'}</div>
          <div class="slot-meta">${a ? esc(a.morph || '') : ''}</div>
        `;
        document.getElementById(slot.row).appendChild(div);
      }

      for (const [colId, cases] of Object.entries(TABLE_COLS)) {
        const col = document.getElementById(colId);
        col.innerHTML = '';
        cases.forEach((c, i) => {
          const a = findAnimal(animals, c.name) || { name: c.name };
          const div = document.createElement('div');
          div.className = 'slot-sm' + (c.black ? ' black-case' : '');
          div.innerHTML = `
            <div class="thumb">${photoHtml(a)}</div>
            <div>
              <div class="nm">${esc(a.name)}${sexMark(a.sex)}</div>
              <div class="mt">${esc(c.note || '奥から' + (i + 1) + '番目')}${a.morph ? '・' + esc(a.morph) : ''}</div>
            </div>
          `;
          col.appendChild(div);
        });
      }
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 個体マスタから写真・モルフを取得（失敗しても名前だけで表示）
    render([]);
    fetch('/api/animals')
      .then(r => r.json())
      .then(render)
      .catch(() => {});
  </script>
</body>
</html>
