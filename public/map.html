<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>レオパ管理 / 配置図</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .map-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .map-note { color:var(--muted); font-size:12px; }

    /* ==== 全体図（部屋を正面から見た配置） ==== */
    .room {
      display:grid; grid-template-columns: 2fr 3fr; gap:18px;
      max-width:1200px; margin:0 auto;
    }
    @media (max-width: 800px) { .room { grid-template-columns: 1fr; } }
    .zone {
      border:2px solid var(--border); border-radius:14px;
      padding:14px; background:var(--card);
    }
    .zone-title {
      font-size:13px; font-weight:700; margin-bottom:10px;
      display:flex; align-items:center; gap:6px; color:var(--muted);
    }
    .zone-grid { display:grid; gap:8px; }
    .zone-grid.cols2 { grid-template-columns:1fr 1fr; }
    .zone-grid.cols3 { grid-template-columns:1fr 1fr 1fr; }
    .zone-row-label { font-size:11px; color:var(--muted); margin:8px 2px 4px; }

    .cell {
      border:1px solid var(--border); border-radius:10px;
      padding:8px; text-align:center; background:#fff;
      display:flex; flex-direction:column; gap:4px; align-items:center;
    }
    .cell.empty { border-style:dashed; background:transparent; }
    .cell.black-case { border-width:2px; border-color:#333; }
    .cell .ph {
      width:100%; aspect-ratio: 4/3; border-radius:6px; overflow:hidden;
      background:var(--bg); display:flex; align-items:center; justify-content:center;
      font-size:22px; color:var(--muted);
    }
    .cell .ph img { width:100%; height:100%; object-fit:cover; display:block; }
    .cell .cn { font-size:14px; font-weight:700; line-height:1.2; }
    .cell .cn .sex { font-weight:400; font-size:12px; }
    .cell .cp { font-size:10px; color:var(--accent); font-weight:600; }
    .cell .cm { font-size:10px; color:var(--muted); line-height:1.3; }
    .cell.sm .ph { aspect-ratio: 16/9; }
    .cell.sm .cn { font-size:13px; }

    @media print {
      header.appbar, .map-toolbar { display:none !important; }
      body { background:#fff; }
      .zone, .cell { break-inside: avoid; }
      main { padding: 0; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <h1>🦎 ひとつなぎ動物管理</h1>
    <nav>
      <a href="/">入力</a>
      <a href="/history.html">履歴</a>
      <a href="/individual.html">個体別</a>
      <a href="/map.html" class="active">配置図</a>
      <a href="/settings.html">設定</a>
    </nav>
  </header>

  <main>
    <h2>🗺 飼育場所マップ</h2>

    <div class="map-toolbar">
      <button class="btn btn-primary" id="printBtn">🖨 印刷する</button>
      <span class="map-note">部屋を正面から見た配置です（2026年6月時点）。写真・モルフは個体マスタから自動表示されます。</span>
    </div>

    <div class="room">
      <div class="zone">
        <div class="zone-title">⬜ 白いテーブル（販売個体・左側）</div>
        <div class="zone-row-label">左列・右列とも 上が奥 → 下が手前</div>
        <div class="zone-grid cols2" id="zoneTable"></div>
      </div>
      <div class="zone">
        <div class="zone-title">🪵 木の棚（名前付き個体・右側）</div>
        <div class="zone-row-label">上段（棚の上）</div>
        <div class="zone-grid cols3" id="zoneBack"></div>
        <div class="zone-row-label">前列（手前）</div>
        <div class="zone-grid cols3" id="zoneFront"></div>
      </div>
    </div>
  </main>

  <script>
    'use strict';

    // ==== 配置定義（変更時はここを書き換える） ====
    // name: 個体マスタの名前と一致させると写真・モルフが自動表示される。空きは null
    const SLOTS = [
      { zone: 'zoneBack',  pos: '左奥（黒い背高ケージ）', name: null },
      { zone: 'zoneBack',  pos: '中央（植物ケージ）',     name: 'アリストテレス' },
      { zone: 'zoneBack',  pos: '右奥（温湿度計付き）',   name: null },
      { zone: 'zoneFront', pos: '前列・左',               name: 'ノブナガ' },
      { zone: 'zoneFront', pos: '前列・中央',             name: 'アレク' },
      { zone: 'zoneFront', pos: '前列・右',               name: 'もみじ' },
    ];

    // 白いテーブル：販売個体ケース（上が奥 → 下が手前）
    const TABLE_COLS = {
      left:  [
        { name: '①', pos: '左列・奥1' },
        { name: '②', pos: '左列・奥2' },
        { name: '③', pos: '左列・奥3' },
        { name: '④', pos: '左列・奥4' },
        { name: '11', pos: '左列・手前（黒ケース）', black: true },
      ],
      right: [
        { name: '⑩', pos: '右列・奥1' },
        { name: '⑨', pos: '右列・奥2' },
        { name: '⑧', pos: '右列・奥3' },
        { name: '⑦', pos: '右列・奥4' },
        { name: '⑥', pos: '右列・手前' },
      ],
    };

    // カタカナ→ひらがな + 空白除去（名前のゆらぎ吸収）
    function norm(s) {
      return (s || '')
        .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
        .replace(/\s+/g, '');
    }

    function sexMark(sex) {
      if (sex === 'M') return '<span class="sex">♂</span>';
      if (sex === 'F') return '<span class="sex">♀</span>';
      return '';
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function findAnimal(animals, name) {
      return animals.find(x => norm(x.name) === norm(name)) || null;
    }

    function photoHtml(a) {
      return a && a.photo_url ? `<img src="${esc(a.photo_url)}" alt="${esc(a.name)}" loading="lazy">` : '🦎';
    }

    function cellHtml(a, pos) {
      if (!a) {
        return `<div class="ph">―</div><div class="cp">${esc(pos)}</div><div class="cn" style="color:var(--muted);font-weight:400">空き</div>`;
      }
      return `
        <div class="ph">${photoHtml(a)}</div>
        <div class="cp">${esc(pos)}</div>
        <div class="cn">${esc(a.name)}${sexMark(a.sex)}</div>
        <div class="cm">${esc(a.morph || '')}</div>
      `;
    }

    function render(animals) {
      // 木の棚（上段・前列）
      document.getElementById('zoneBack').innerHTML = '';
      document.getElementById('zoneFront').innerHTML = '';
      for (const slot of SLOTS) {
        const a = slot.name ? (findAnimal(animals, slot.name) || { name: slot.name }) : null;
        const div = document.createElement('div');
        div.className = 'cell' + (a ? '' : ' empty');
        div.innerHTML = cellHtml(a, slot.pos);
        document.getElementById(slot.zone).appendChild(div);
      }

      // 白いテーブル（2列、上が奥 → 下が手前）
      const zt = document.getElementById('zoneTable');
      zt.innerHTML = '';
      const maxLen = Math.max(TABLE_COLS.left.length, TABLE_COLS.right.length);
      for (let i = 0; i < maxLen; i++) {
        for (const colName of ['left', 'right']) {
          const c = TABLE_COLS[colName][i];
          const div = document.createElement('div');
          if (!c) { div.className = 'cell sm empty'; zt.appendChild(div); continue; }
          const a = findAnimal(animals, c.name) || { name: c.name };
          div.className = 'cell sm' + (c.black ? ' black-case' : '');
          div.innerHTML = cellHtml(a, c.pos);
          zt.appendChild(div);
        }
      }
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 個体マスタから写真・モルフを取得（失敗しても名前だけで表示）
    render([]);
    fetch('/api/animals')
      .then(r => r.json())
      .then(render)
      .catch(() => {});
  </script>
</body>
</html>
