<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>レオパ管理 / 配置図</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .map-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .map-note { color:var(--muted); font-size:12px; }

    .rack { max-width: 1100px; margin: 0 auto; }
    .rack-row-label {
      font-size:13px; font-weight:600; color:var(--muted);
      margin: 16px 4px 8px;
    }
    .rack-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
    @media (max-width: 700px) { .rack-row { grid-template-columns: 1fr; } }

    .slot {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .slot.empty { border-style: dashed; background: transparent; }
    .slot-pos {
      font-size: 12px; color: var(--muted); font-weight: 600;
      display:flex; align-items:center; gap:6px;
    }
    .slot-photo {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 8px;
      background: var(--bg);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; font-size: 40px; color: var(--muted);
    }
    .slot-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .slot-name { font-size: 20px; font-weight: 700; line-height:1.3; }
    .slot-name .sex { font-size:14px; font-weight:400; margin-left:6px; }
    .slot-meta { font-size: 12px; color: var(--muted); min-height: 1.2em; }

    @media print {
      header.appbar, .map-toolbar { display:none !important; }
      body { background:#fff; }
      .slot { break-inside: avoid; }
      main { padding: 0; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <h1>🦎 ひとつなぎ動物管理</h1>
    <nav>
      <a href="/">入力</a>
      <a href="/history.html">履歴</a>
      <a href="/individual.html">個体別</a>
      <a href="/map.html" class="active">配置図</a>
      <a href="/settings.html">設定</a>
    </nav>
  </header>

  <main>
    <h2>🗺 飼育場所マップ</h2>

    <div class="map-toolbar">
      <button class="btn btn-primary" id="printBtn">🖨 印刷する</button>
      <span class="map-note">ケージの実際の並びと同じレイアウトです（2026年6月時点）。写真・モルフは個体マスタから自動表示されます。</span>
    </div>

    <div class="rack">
      <div class="rack-row-label">上段（棚の上）</div>
      <div class="rack-row" id="rowBack"></div>
      <div class="rack-row-label">前列（手前・テーブル上）</div>
      <div class="rack-row" id="rowFront"></div>
    </div>
  </main>

  <script>
    'use strict';

    // ==== 配置定義（変更時はここを書き換える） ====
    // name: 個体マスタの名前と一致させると写真・モルフが自動表示される。空きは null
    const SLOTS = [
      { row: 'rowBack',  label: '左奥（黒い背高ケージ）', name: null },
      { row: 'rowBack',  label: '上段中央（植物ケージ）', name: 'アリストテレス' },
      { row: 'rowBack',  label: '右奥（温湿度計付き）',   name: null },
      { row: 'rowFront', label: '前列・左',               name: 'ノブナガ' },
      { row: 'rowFront', label: '前列・中央',             name: 'アレク' },
      { row: 'rowFront', label: '前列・右',               name: 'もみじ' },
    ];

    // カタカナ→ひらがな + 空白除去（名前のゆらぎ吸収）
    function norm(s) {
      return (s || '')
        .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
        .replace(/\s+/g, '');
    }

    function sexMark(sex) {
      if (sex === 'M') return '<span class="sex">♂</span>';
      if (sex === 'F') return '<span class="sex">♀</span>';
      return '';
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function render(animals) {
      document.getElementById('rowBack').innerHTML = '';
      document.getElementById('rowFront').innerHTML = '';

      for (const slot of SLOTS) {
        const a = slot.name
          ? animals.find(x => norm(x.name) === norm(slot.name)) || { name: slot.name }
          : null;

        const div = document.createElement('div');
        div.className = 'slot' + (a ? '' : ' empty');
        div.innerHTML = `
          <div class="slot-pos">📍 ${esc(slot.label)}</div>
          <div class="slot-photo">${a && a.photo_url ? `<img src="${esc(a.photo_url)}" alt="${esc(a.name)}">` : '🦎'}</div>
          <div class="slot-name">${a ? esc(a.name) + sexMark(a.sex) : '<span style="color:var(--muted);font-size:14px;font-weight:400">空き</span>'}</div>
          <div class="slot-meta">${a ? esc(a.morph || '') : ''}</div>
        `;
        document.getElementById(slot.row).appendChild(div);
      }
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 個体マスタから写真・モルフを取得（失敗しても名前だけで表示）
    render([]);
    fetch('/api/animals')
      .then(r => r.json())
      .then(render)
      .catch(() => {});
  </script>
</body>
</html>
