services:
  - type: web
    name: leopard-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_DATABASE_URL
        sync: false      # Render UIで設定
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CHATWORK_API_TOKEN
        sync: false
      - key: CHATWORK_ROOM_ID
        sync: false
      - key: CHATWORK_MENTION_IDS
        sync: false
      - key: NOTIFY_ENABLED
        value: "true"
      - key: NOTIFY_MORNING_CRON
        value: "0 9 * * *"       # 朝9時：摂食アラート
      - key: NOTIFY_EVENING_CRON
        value: "0 18 * * *"      # 18時：当日の記入漏れリマインド
      - key: NOTIFY_MISSING_NEXT_CRON
        value: "0 12 * * *"      # 翌日12時：前日分の記入漏れ再リマインド
      - key: CLOUDINARY_CLOUD_NAME
        sync: false      # Cloudinary 管理画面で取得
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
